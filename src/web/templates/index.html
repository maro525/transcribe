<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Transcribe Dashboard</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <style>
        :root { color-scheme: light dark; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
        }
        h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
        .subtitle { color: #888; font-size: 0.85rem; margin: 0.25rem 0 1.5rem; }
        .status-bar {
            font-size: 0.8rem;
            color: #666;
            background: rgba(127,127,127,0.08);
            padding: 0.4rem 0.7rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td {
            padding: 0.55rem 0.6rem;
            text-align: left;
            border-bottom: 1px solid rgba(127,127,127,0.2);
            vertical-align: top;
        }
        th {
            font-weight: 600;
            font-size: 0.75rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .state {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .state-queued { background: #e5e5e5; color: #555; }
        .state-processing { background: #fff3cd; color: #856404; }
        .state-done { background: #d4edda; color: #155724; }
        .state-error { background: #f8d7da; color: #721c24; }
        .current { color: #777; font-size: 0.8rem; max-width: 360px; }
        a { color: #0366d6; text-decoration: none; cursor: pointer; }
        a:hover { text-decoration: underline; }
        .empty { color: #999; text-align: center; padding: 3rem 1rem; }
        pre.transcript {
            white-space: pre-wrap;
            background: rgba(127,127,127,0.08);
            padding: 0.8rem;
            border-radius: 4px;
            margin: 1rem 0 0;
            max-height: 360px;
            overflow: auto;
            font-size: 0.82rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .viewer-title {
            font-size: 0.85rem;
            color: #888;
            margin: 1.5rem 0 0;
        }
        code {
            background: rgba(127,127,127,0.12);
            padding: 0.05rem 0.35rem;
            border-radius: 3px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <h1>Transcribe Dashboard</h1>
    <p class="subtitle">音声を <code>input/</code> に置くと自動で処理されます。</p>
    <div hx-get="/jobs" hx-trigger="load, every 2s" hx-swap="innerHTML"></div>
    <div id="viewer"></div>
</body>
</html>
