<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Transcribe Dashboard</title>
    <!-- "Aetheric Precision" web fonts: Plus Jakarta Sans (headings) + Inter
         (body/labels). Same link as detail.html so both pages stay in sync. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
    <style>
        /* "Aetheric Precision" design tokens — identical to detail.html. */
        :root {
            color-scheme: light dark;
            --bg: #FAFAFB;
            --card: #FFFFFF;
            --text: #18181B;
            --muted: #71717A;
            --faint: #A1A1AA;
            --border: #EAEAEC;
            --divider: #ECECEE;
            --accent: #4F46E5;
            --accent-soft: rgba(79, 70, 229, 0.08);
            --ok-bg: #F0FDF4;
            --ok-text: #166534;
            --err-bg: #FEF2F2;
            --err-text: #991B1B;
            --track: #F4F4F5;
            --radius: 12px;
            --shadow-float: 0 4px 12px rgba(0, 0, 0, 0.03);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111113;
                --card: #1A1A1D;
                --text: #E7E7EA;
                --muted: #9A9AA3;
                --faint: #70707A;
                --border: #26262B;
                --divider: #222227;
                --accent: #818CF8;
                --accent-soft: rgba(129, 140, 248, 0.14);
                --ok-bg: rgba(22, 101, 52, 0.28);
                --ok-text: #86EFAC;
                --err-bg: rgba(153, 27, 27, 0.25);
                --err-text: #FCA5A5;
                --track: #232328;
                --shadow-float: 0 4px 12px rgba(0, 0, 0, 0.25);
            }
        }
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 1040px;
            margin: 2.5rem auto 4rem;
            padding: 0 1.25rem;
            line-height: 1.7;
        }
        h1 {
            font-family: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont,
                "Segoe UI", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.35;
            margin: 0 0 0.35rem;
        }
        .subtitle {
            color: var(--muted);
            font-size: 0.85rem;
            margin: 0 0 1.5rem;
        }
        .subtitle a { white-space: nowrap; }
        a { color: var(--accent); text-decoration: none; cursor: pointer; }
        a:hover { text-decoration: underline; }
        code {
            background: var(--track);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.05rem 0.4rem;
            border-radius: 6px;
            font-size: 0.82em;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .status-bar {
            font-size: 0.8rem;
            color: var(--muted);
            background: var(--track);
            padding: 0.55rem 0.9rem;
            border-radius: 10px;
            margin-bottom: 1.1rem;
            display: flex;
            gap: 0.75rem;
            justify-content: space-between;
            align-items: center;
        }
        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--faint);
            font-size: 0.75rem;
            white-space: nowrap;
        }
        .connection-status.is-live { color: var(--muted); }
        .connection-status.is-live::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22C55E;
            flex: none;
        }
        /* Card shell around whatever fills it: the JS-rendered table, the
           server-rendered fallback (_jobs.html), or the empty state. */
        #jobs-root {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-float);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }
        th, td {
            padding: 0.85rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        tbody tr:last-child th,
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: var(--bg); }
        th {
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        td.file { font-weight: 500; word-break: break-all; }
        td.num { font-variant-numeric: tabular-nums; }
        .state {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.65rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .state::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .state-done { background: var(--ok-bg); color: var(--ok-text); }
        .state-processing { background: var(--accent-soft); color: var(--accent); }
        .state-queued { background: var(--track); color: var(--muted); }
        .state-error { background: var(--err-bg); color: var(--err-text); }
        .current {
            color: var(--muted);
            font-size: 0.8rem;
            max-width: 360px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        td a { white-space: nowrap; }
        .cell-error { color: var(--err-text); font-size: 0.78rem; }
        .empty {
            color: var(--muted);
            text-align: center;
            padding: 3.5rem 1rem;
            font-size: 0.9rem;
        }
        @media (max-width: 640px) {
            body { margin: 1.25rem auto 2.5rem; }
            /* Keep sane column widths and let the card scroll horizontally. */
            table { min-width: 560px; }
            .current { max-width: 180px; }
            th, td { padding: 0.7rem 0.75rem; }
        }
    </style>
</head>
<body>
    <h1>Transcribe Dashboard</h1>
    <p class="subtitle">音声を <code>input/</code> に置くと自動で処理されます。
        <a href="/live">リアルタイムモード →</a></p>
    <div class="status-bar">
        <span id="system-message">{{ system_message }}</span>
        <span id="connection-status" class="connection-status">connecting...</span>
    </div>
    <div id="jobs-root">
        {% include "_jobs.html" %}
    </div>
    <script>
        (() => {
            const systemMessage = document.getElementById("system-message");
            const connectionStatus = document.getElementById("connection-status");
            const jobsRoot = document.getElementById("jobs-root");
            const jobs = new Map();
            let source = null;
            let opened = false;
            let consecutiveErrors = 0;
            let pollingTimer = null;

            const stateOrder = { processing: 0, queued: 1, error: 2, done: 3 };
            const stateLabels = { queued: "待機中", processing: "処理中", done: "完了", error: "エラー" };

            function setConnectionStatus(text) {
                connectionStatus.textContent = text;
                connectionStatus.classList.toggle("is-live", text === "live");
            }

            function sortedJobs() {
                return Array.from(jobs.values()).sort((a, b) => {
                    const stateDiff = (stateOrder[a.state] ?? 99) - (stateOrder[b.state] ?? 99);
                    return stateDiff || a.filename.localeCompare(b.filename);
                });
            }

            function appendCell(row, text, className) {
                const cell = document.createElement("td");
                if (className) cell.className = className;
                cell.textContent = text || "";
                row.appendChild(cell);
                return cell;
            }

            function renderJobs() {
                const currentJobs = sortedJobs();
                jobsRoot.replaceChildren();

                if (currentJobs.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "empty";
                    empty.append("音声ファイルを ");
                    const code = document.createElement("code");
                    code.textContent = "input/";
                    empty.append(code, " に入れてください");
                    jobsRoot.appendChild(empty);
                    return;
                }

                const table = document.createElement("table");
                const thead = document.createElement("thead");
                const headerRow = document.createElement("tr");
                ["ファイル", "状態", "セグメント", "最新", ""].forEach((label) => {
                    const th = document.createElement("th");
                    th.textContent = label;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement("tbody");
                currentJobs.forEach((job) => {
                    const row = document.createElement("tr");
                    appendCell(row, job.filename, "file");

                    const stateCell = document.createElement("td");
                    const state = document.createElement("span");
                    state.className = `state state-${job.state}`;
                    state.textContent = stateLabels[job.state] || job.state;
                    stateCell.appendChild(state);
                    row.appendChild(stateCell);

                    appendCell(row, String(job.segments_completed ?? 0), "num");
                    appendCell(row, job.current_text || "", "current");

                    const actionCell = document.createElement("td");
                    if (job.state === "done" && job.output_path) {
                        const link = document.createElement("a");
                        link.textContent = "詳細 →";
                        link.href = `/jobs/${encodeURIComponent(job.filename)}`;
                        actionCell.appendChild(link);
                    } else if (job.state === "error") {
                        const error = document.createElement("span");
                        error.className = "cell-error";
                        error.textContent = job.error || "";
                        actionCell.appendChild(error);
                    }
                    row.appendChild(actionCell);
                    tbody.appendChild(row);
                });
                table.appendChild(tbody);
                jobsRoot.appendChild(table);
            }

            function applySnapshot(payload) {
                systemMessage.textContent = payload.system_message || "";
                jobs.clear();
                (payload.jobs || []).forEach((job) => jobs.set(job.filename, job));
                renderJobs();
            }

            function applyJob(payload) {
                if (!payload.job || !payload.job.filename) return;
                jobs.set(payload.job.filename, payload.job);
                renderJobs();
            }

            function startPollingFallback() {
                if (source) source.close();
                if (pollingTimer) return;
                setConnectionStatus("polling fallback");

                const poll = async () => {
                    try {
                        const response = await fetch("/jobs", { cache: "no-store" });
                        if (response.ok) {
                            const wrapper = document.createElement("div");
                            wrapper.innerHTML = await response.text();
                            const fallbackStatus = wrapper.querySelector(".status-bar");
                            if (fallbackStatus) {
                                systemMessage.textContent = fallbackStatus.textContent || "";
                                fallbackStatus.remove();
                            }
                            jobsRoot.replaceChildren(...Array.from(wrapper.childNodes));
                        }
                    } catch (_) {
                        // Keep trying on the next interval.
                    }
                };
                poll();
                pollingTimer = window.setInterval(poll, 2000);
            }

            function addJsonListener(eventName, handler) {
                source.addEventListener(eventName, (event) => {
                    try {
                        handler(JSON.parse(event.data));
                    } catch (_) {
                        // Ignore malformed events and wait for the next snapshot/update.
                    }
                });
            }

            if (!window.EventSource) {
                startPollingFallback();
                return;
            }

            source = new EventSource("/events");
            source.addEventListener("open", () => {
                opened = true;
                consecutiveErrors = 0;
                setConnectionStatus("live");
            });
            source.addEventListener("error", () => {
                setConnectionStatus("reconnecting...");
                if (!opened) consecutiveErrors += 1;
                if (!opened && consecutiveErrors >= 3) startPollingFallback();
            });
            addJsonListener("snapshot", applySnapshot);
            addJsonListener("job_registered", applyJob);
            addJsonListener("job_updated", applyJob);
            addJsonListener("system_message", (payload) => {
                systemMessage.textContent = payload.system_message || "";
            });
            addJsonListener("reset", () => {
                setConnectionStatus("reconnecting...");
                source.close();
                window.setTimeout(() => {
                    window.location.reload();
                }, 200);
            });
            addJsonListener("heartbeat", () => {});
        })();
    </script>
</body>
</html>
