<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Transcribe Dashboard</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <style>
        :root { color-scheme: light dark; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
        }
        h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
        .subtitle { color: #888; font-size: 0.85rem; margin: 0.25rem 0 1.5rem; }
        .status-bar {
            font-size: 0.8rem;
            color: #666;
            background: rgba(127,127,127,0.08);
            padding: 0.4rem 0.7rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: flex;
            gap: 0.75rem;
            justify-content: space-between;
            align-items: center;
        }
        .connection-status { color: #888; white-space: nowrap; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td {
            padding: 0.55rem 0.6rem;
            text-align: left;
            border-bottom: 1px solid rgba(127,127,127,0.2);
            vertical-align: top;
        }
        th {
            font-weight: 600;
            font-size: 0.75rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .state {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .state-queued { background: #e5e5e5; color: #555; }
        .state-processing { background: #fff3cd; color: #856404; }
        .state-done { background: #d4edda; color: #155724; }
        .state-error { background: #f8d7da; color: #721c24; }
        .current { color: #777; font-size: 0.8rem; max-width: 360px; }
        a { color: #0366d6; text-decoration: none; cursor: pointer; }
        a:hover { text-decoration: underline; }
        .empty { color: #999; text-align: center; padding: 3rem 1rem; }
        pre.transcript {
            white-space: pre-wrap;
            background: rgba(127,127,127,0.08);
            padding: 0.8rem;
            border-radius: 4px;
            margin: 1rem 0 0;
            max-height: 360px;
            overflow: auto;
            font-size: 0.82rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .viewer-title {
            font-size: 0.85rem;
            color: #888;
            margin: 1.5rem 0 0;
        }
        code {
            background: rgba(127,127,127,0.12);
            padding: 0.05rem 0.35rem;
            border-radius: 3px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <h1>Transcribe Dashboard</h1>
    <p class="subtitle">音声を <code>input/</code> に置くと自動で処理されます。</p>
    <div class="status-bar">
        <span id="system-message">{{ system_message }}</span>
        <span id="connection-status" class="connection-status">connecting...</span>
    </div>
    <div id="jobs-root">
        {% include "_jobs.html" %}
    </div>
    <div id="viewer"></div>
    <script>
        (() => {
            const systemMessage = document.getElementById("system-message");
            const connectionStatus = document.getElementById("connection-status");
            const jobsRoot = document.getElementById("jobs-root");
            const jobs = new Map();
            let source = null;
            let opened = false;
            let consecutiveErrors = 0;
            let pollingTimer = null;

            const stateOrder = { processing: 0, queued: 1, error: 2, done: 3 };

            function setConnectionStatus(text) {
                connectionStatus.textContent = text;
            }

            function sortedJobs() {
                return Array.from(jobs.values()).sort((a, b) => {
                    const stateDiff = (stateOrder[a.state] ?? 99) - (stateOrder[b.state] ?? 99);
                    return stateDiff || a.filename.localeCompare(b.filename);
                });
            }

            function appendCell(row, text, className) {
                const cell = document.createElement("td");
                if (className) cell.className = className;
                cell.textContent = text || "";
                row.appendChild(cell);
                return cell;
            }

            function renderJobs() {
                const currentJobs = sortedJobs();
                jobsRoot.replaceChildren();

                if (currentJobs.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "empty";
                    empty.append("音声ファイルを ");
                    const code = document.createElement("code");
                    code.textContent = "input/";
                    empty.append(code, " に入れてください");
                    jobsRoot.appendChild(empty);
                    return;
                }

                const table = document.createElement("table");
                const thead = document.createElement("thead");
                const headerRow = document.createElement("tr");
                ["ファイル", "状態", "セグメント", "最新", ""].forEach((label) => {
                    const th = document.createElement("th");
                    th.textContent = label;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement("tbody");
                currentJobs.forEach((job) => {
                    const row = document.createElement("tr");
                    appendCell(row, job.filename);

                    const stateCell = document.createElement("td");
                    const state = document.createElement("span");
                    state.className = `state state-${job.state}`;
                    state.textContent = job.state;
                    stateCell.appendChild(state);
                    row.appendChild(stateCell);

                    appendCell(row, String(job.segments_completed ?? 0));
                    appendCell(row, job.current_text || "", "current");

                    const actionCell = document.createElement("td");
                    if (job.state === "done" && job.output_path) {
                        const link = document.createElement("a");
                        link.textContent = "表示";
                        link.setAttribute("hx-get", `/jobs/${encodeURIComponent(job.filename)}/transcript`);
                        link.setAttribute("hx-target", "#viewer");
                        link.setAttribute("hx-swap", "innerHTML");
                        actionCell.appendChild(link);
                    } else if (job.state === "error") {
                        const error = document.createElement("span");
                        error.style.color = "#a33";
                        error.style.fontSize = "0.8rem";
                        error.textContent = job.error || "";
                        actionCell.appendChild(error);
                    }
                    row.appendChild(actionCell);
                    tbody.appendChild(row);
                });
                table.appendChild(tbody);
                jobsRoot.appendChild(table);
                if (window.htmx) window.htmx.process(jobsRoot);
            }

            function applySnapshot(payload) {
                systemMessage.textContent = payload.system_message || "";
                jobs.clear();
                (payload.jobs || []).forEach((job) => jobs.set(job.filename, job));
                renderJobs();
            }

            function applyJob(payload) {
                if (!payload.job || !payload.job.filename) return;
                jobs.set(payload.job.filename, payload.job);
                renderJobs();
            }

            function startPollingFallback() {
                if (source) source.close();
                if (pollingTimer) return;
                setConnectionStatus("polling fallback");

                const poll = async () => {
                    try {
                        const response = await fetch("/jobs", { cache: "no-store" });
                        if (response.ok) {
                            const wrapper = document.createElement("div");
                            wrapper.innerHTML = await response.text();
                            const fallbackStatus = wrapper.querySelector(".status-bar");
                            if (fallbackStatus) {
                                systemMessage.textContent = fallbackStatus.textContent || "";
                                fallbackStatus.remove();
                            }
                            jobsRoot.replaceChildren(...Array.from(wrapper.childNodes));
                            if (window.htmx) window.htmx.process(jobsRoot);
                        }
                    } catch (_) {
                        // Keep trying on the next interval.
                    }
                };
                poll();
                pollingTimer = window.setInterval(poll, 2000);
            }

            function addJsonListener(eventName, handler) {
                source.addEventListener(eventName, (event) => {
                    try {
                        handler(JSON.parse(event.data));
                    } catch (_) {
                        // Ignore malformed events and wait for the next snapshot/update.
                    }
                });
            }

            if (!window.EventSource) {
                startPollingFallback();
                return;
            }

            source = new EventSource("/events");
            source.addEventListener("open", () => {
                opened = true;
                consecutiveErrors = 0;
                setConnectionStatus("live");
            });
            source.addEventListener("error", () => {
                setConnectionStatus("reconnecting...");
                if (!opened) consecutiveErrors += 1;
                if (!opened && consecutiveErrors >= 3) startPollingFallback();
            });
            addJsonListener("snapshot", applySnapshot);
            addJsonListener("job_registered", applyJob);
            addJsonListener("job_updated", applyJob);
            addJsonListener("system_message", (payload) => {
                systemMessage.textContent = payload.system_message || "";
            });
            addJsonListener("reset", () => {
                setConnectionStatus("reconnecting...");
                source.close();
                window.setTimeout(() => {
                    window.location.reload();
                }, 200);
            });
            addJsonListener("heartbeat", () => {});
        })();
    </script>
</body>
</html>
